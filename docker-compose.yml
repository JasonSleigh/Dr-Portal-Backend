services:
  frontend:
    build:
      context: ./frontend
    container_name: drportal_frontend
    restart: unless-stopped
    networks:
      - drportal_network

  backend:
    build:
      context: ./backend
    container_name: drportal_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis