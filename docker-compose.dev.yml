services:
  db:
    image: postgres:16-alpine
    container_name: drportal_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - db-network

  backend:
    build: ./backend/src
    container_name: drportal_backend
    restart: unless-stopped
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment: 
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ENVIRONMENT=local
    depends_on: 
      - db
    volumes:
      - ./backend:/app
      - ./assets:/app/assets
    networks:
      - app-network
      - db-network
    expose:
      - "8000"

  nginx:
    image: nginx:1.28-alpine
    container_name: drportal_nginx_local
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres_data: